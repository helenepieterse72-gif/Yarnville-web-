<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Yarnville</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #fdf6e3; padding: 20px; }
        .yarnling-card { border: 1px solid #ccc; padding: 15px; margin: 10px; display: inline-block; width: 200px; border-radius: 10px; background: white; }
    </style>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <h1>Welkom in Yarnville!</h1>
    
    <div id="yarnlings-list"></div>

    <script>
        // Hierdie skrif lees jou inhoud
        fetch('/content/yarnlings/index.json')
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('yarnlings-list');
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'yarnling-card';
                    div.innerHTML = `<h3>${item.name}</h3><p>${item.body}</p>`;
                    list.appendChild(div);
                });
            });
    </script>
</body>
</html>
