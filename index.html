<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Yarnville</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #fdf6e3; padding: 20px; }
        .yarnling-card { border: 1px solid #ccc; padding: 15px; margin: 10px; display: inline-block; width: 200px; border-radius: 10px; background: white; }
    </style>
</head>
<body>
    <h1>Welcome to Yarnville!</h1>
    <div id="yarnlings-list"></div>

    <script>
        // Ons probeer nou 'n ander pad om te sien of die data daar is
        fetch('/admin/config.yml')
            .then(response => {
                if (response.ok) {
                    document.getElementById('yarnlings-list').innerHTML = "<p>Die admin-konneksie is gevind!</p>";
                } else {
                    document.getElementById('yarnlings-list').innerHTML = "<p>Data nog nie gevind nie.</p>";
                }
            });
    </script>
</body>
</html>
