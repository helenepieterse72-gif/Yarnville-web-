<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Yarnville</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #fdf6e3; padding: 20px; }
        .card { border: 2px solid #5d4037; padding: 20px; margin: 20px auto; width: 300px; border-radius: 15px; background: white; }
    </style>
</head>
<body>
    <h1>Welcome to Yarnville!</h1>
    <div id="content">Loading Binkie Bunny...</div>

    <script>
        fetch('/yarnlings/binkie-bunny.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('content').innerHTML = 
                `<div class="card"><h2>${data.name}</h2><p>${data.body}</p></div>`;
            })
            .catch(err => {
                document.getElementById('content').innerHTML = "Kon Binkie nie kry nie. Wag 'n oomblik...";
            });
    </script>
</body>
</html>
